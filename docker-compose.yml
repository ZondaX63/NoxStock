name: noxstock

services:
  postgres:
    image: postgres:17-alpine
    container_name: noxstock-postgres
    environment:
      POSTGRES_DB: NoxStock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1121"
    ports:
      - "5439:5432"
    volumes:
      - noxstock-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d NoxStock"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-migrator:
    image: noxstock-dbmigrator
    build:
      context: .
      dockerfile: src/NoxStock.DbMigrator/Dockerfile
    container_name: noxstock-dbmigrator
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=NoxStock;User ID=postgres;Password=1121;"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: noxstock-web
    build:
      context: .
      dockerfile: src/NoxStock.Web/Dockerfile
    container_name: noxstock-web
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=NoxStock;User ID=postgres;Password=1121;"
      App__SelfUrl: "http://138.3.254.5:8080"
      AuthServer__Authority: "http://138.3.254.5:8080"
      AuthServer__RequireHttpsMetadata: "false"
      App__HealthUiCheckUrl: "http://localhost:80/health-status"
    volumes:
      - noxstock-data-protection:/root/.aspnet/DataProtection-Keys
    depends_on:
      db-migrator:
        condition: service_completed_successfully

volumes:
  noxstock-postgres-data:
    name: noxstock-postgres-data
  noxstock-data-protection:
    name: noxstock-data-protection
