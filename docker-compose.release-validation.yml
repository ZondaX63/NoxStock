name: noxstock-release-validation

services:
  postgres:
    networks:
      release-validation:

  db-migrator:
    networks:
      release-validation:

  web:
    networks:
      release-validation:

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NOXSTOCK_HTTPS_PORT:-8443}:443"
    volumes:
      - ./etc/release/nginx-private-beta.conf:/etc/nginx/conf.d/default.conf:ro
      - "${NOXSTOCK_TLS_CERT_PATH:?NOXSTOCK_TLS_CERT_PATH is required}:/etc/nginx/tls/tls.crt:ro"
      - "${NOXSTOCK_TLS_KEY_PATH:?NOXSTOCK_TLS_KEY_PATH is required}:/etc/nginx/tls/tls.key:ro"
    depends_on:
      web:
        condition: service_healthy
    networks:
      release-validation:
        ipv4_address: 172.31.251.10
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://localhost/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  release-validation:
    ipam:
      config:
        - subnet: 172.31.251.0/24
